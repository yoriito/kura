[package]
name = "kura"
version = "0.2.0"
license = "Apache-2.0"
description = "Kura is a platform for vehicle signal processing, data management, and client/server communication, centered around the Vehicle Signal Specification (VSS)."
edition = "2024"

[dependencies]
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tonic = "0.14"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.18"
uuid = { version = "1.22.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
serde_yaml = "0.9.34"
serde = {version = "1.0.228", features = ["derive"] }
clap = { version = "4.5.60", features = ["derive"] }
log = "0.4.29"
tracing = "0.1.44"
bincode = "2.0.1"
async-trait = "0.1.89"
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio-util = "0.7.18"
anyhow = "1.0.102"
tokio-tungstenite = "0.29.0"
futures-util = "0.3.32"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
globset = "0.4.18"
libc = "0.2.182"
dashmap = "6.1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
futures = "0.3.32"

[features]
default = [ "yoriito", "fake_platform", "memdb" ]
all = [ "yoriito", "fake_platform", "memdb" ]
yoriito = []
fake_platform = []
memdb = []


[build-dependencies]
tonic-prost-build = "0.14.5"
glob = "0.3.3"

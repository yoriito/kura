[package]
name = "kura"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.12.6"
prost-types = "0.12.6"
sled = "0.34.7"
tonic = "0.10.2"
tokio = { version = "1.50.0", features = ["full"] }
tokio-stream = "0.1.18"
uuid = { version = "1.22.0", features = ["v4"] }
chrono = { version = "0.4.44", features = ["serde"] }
serde_yaml = "0.9.34"
serde = {version = "1.0.228", features = ["derive"] }
clap = { version = "4.5.60", features = ["derive"] }
log = "0.4.29"
tracing = "0.1.44"
bincode = "2.0.1"
async-trait = "0.1.89"
serde_json = "1.0.149"
sha2 = "0.10.9"
tokio-util = "0.7.18"
anyhow = "1.0.102"
tokio-tungstenite = "0.27.0"
futures-util = "0.3.32"
tracing-subscriber = { version = "0.3.22", features = ["fmt", "env-filter"] }
globset = "0.4.18"
libc = "0.2.182"
dashmap = "6.1.0"
strum = "0.27.2"
strum_macros = "0.27.2"
futures = "0.3.32"

[features]
default = [ "yoriito", "fake_platform", "memdb" ]
all = [ "yoriito", "viss", "ros", "http", "websocket", "fake_platform", "memdb" ]
yoriito = []
viss = []
ros = []
http = []
websocket = []
fake_platform = []
memdb = []


[build-dependencies]
tonic-build = "0.10.2"
glob = "0.3.3"

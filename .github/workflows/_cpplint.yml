name: Run cpplint

on:
  workflow_call:

jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'


      - name: Run cpplint
        run: |
          pip install cpplint==2.0.2
          cpplint --recursive --exclude=client/cc/build --exclude=client/cc/consumer/test --exclude=client/cc/producer/test --exclude=client/cc/test_fuzz --root=client/cc client/cc --config=CPPLINT.cfg 2> cpplint.log

      - name: Parse cpplint results
        if: always()
        run: |
          cd ${{github.workspace}}
          if [ -s cpplint.log ]; then
            python3 ./cpplint_parse.py
          else
            echo "No cpplint result found." >> summary.md
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cpplint-result
          path: |
            summary.md
            cpplint.log
          if-no-files-found: warn

name: Run lizard

on:
  workflow_call:

jobs:
  lizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare lizard
        run: |
          cd ${{github.workspace}}
          python3 -m venv .venv
          source .venv/bin/activate
          pip install lizard==1.24.0
          pip install jinja2==3.1.6

      - name: Run lizard
        run: |
          cd ${{github.workspace}}
          source .venv/bin/activate
          lizard -l cpp -C 25 -L 100 -a 10 -w -x "./client/cc/common/*" -x "./client/cc/build/*" -x "./client/cc/*/test/*" ./client/cc
          lizard -l rust -C 15 -L 100 -a 10 -w -x ./kura
          lizard -l cpp -C 25 -L 100 -a 10 -w -x "./client/cc/common/*" -x "./client/cc/build/*" -x "./client/cc/*/test/*" ./client/cc --html > lizard_cc_result.html
          lizard -l rust -C 15 -L 100 -a 10 -w -x ./kura --html > lizard_rust_result.html
          deactivate

      - name: Upload result
        uses: actions/upload-artifact@v6
        with:
          name: lizard-result
          path: |
            ${{github.workspace}}/lizard_cc_result.html
            ${{github.workspace}}/lizard_rust_result.html

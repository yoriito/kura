name: Linting

on:
  workflow_call:

jobs:
  cpplint:
    name: CppLint
    uses: ./.github/workflows/_cpplint.yml
  lizard:
    name: Lizard
    uses: ./.github/workflows/_lizard.yml
  clang-format:
    name: Clang-Format
    uses: ./.github/workflows/_clang-format.yml
  coverity:
    if: ${{ vars.IS_COVERITY_ENABLED == 'true' }}
    name: Coverity Scen
    uses: ./.github/workflows/_coverity.yml
    secrets: inherit

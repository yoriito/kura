name: Autotically Fix against the Linting Violations
on:
  push:
    branches:
        - "**"
        - "*/*"
        - "*!main*"
        - "*!development*"

permissions:
  contents: write
jobs:
  fix-kura:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ steps.app-token.outputs.token }} # For submodules

      - uses: arduino/setup-protoc@v3
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy

      - name: run formatter
        run: |
          cd kura
          cargo fix
          cargo fmt

      - name: fail if formatting changed files
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "Formatting produced changes. Please run cargo fix/cargo fmt locally."
            git --no-pager diff
            exit 1
          fi

      - name: run clippy (deny warnings)
        run: |
          cd kura
          cargo clippy -- -D warnings

  fix-vshot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: run formatter
      run: |
        pip install autopep8
        autopep8 -r client/vshot/vshot --in-place

    - name: fail if formatting changed files
      run: |
        git status --porcelain
        if [ -n "$(git status --porcelain)" ]; then
          echo "Formatting produced changes. Please run autopep8 locally."
          git --no-pager diff
          exit 1
        fi

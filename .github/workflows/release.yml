# .github/workflows/release.yml

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      initial-development:
        description: 'Create an initial release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Create a prerelease'
        required: false
        default: true
        type: boolean
      prerelease-suffix:
        description: 'Suffix for the prerelease version'
        required: false
        default: 'rc'
        type: string
      tag-prefix:
        description: 'Prefix for the release tag'
        required: false
        default: 'v'
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # ================================================================
  # Validation when merging to main
  # ================================================================
  build-test:
    name: Build and Test
    uses: ./.github/workflows/_build-test.yml
    secrets: inherit

  # ================================================================
  # Release
  # ================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-test]
    outputs:
      release-created: ${{ steps.release.outputs.release-created }}
      version: ${{ steps.release.outputs.version }}
      tag-name: ${{ steps.release.outputs.tag-name }}
      bump-type: ${{ steps.release.outputs.bump-type }}

    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      # ================================================================
      # RELEASE
      # - Analyze commits and determine version
      # - Generate CHANGELOG
      # - Commit CHANGELOG, create tag, and Github Release
      # ================================================================
      - name: Release
        id: release
        uses: yoriito/actions/semantic-release@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          initial-development: ${{ github.event.inputs.initial-development || vars.INITIAL_DEVELOPMENT || true }}
          prerelease: ${{ github.event.inputs.prerelease || vars.PRERELEASE || true }}
          prerelease-suffix: ${{ github.event.inputs.prerelease-suffix || vars.PRERELEASE_SUFFIX || 'rc' }}
          tag-prefix: ${{ github.event.inputs.tag-prefix || vars.TAG_PREFIX || 'v' }}

      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.release-created }}" = "true" ]; then
            echo "## 🎉 Release Created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Version | ${{ steps.release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tag | ${{ steps.release.outputs.tag-name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Type | ${{ steps.release.outputs.bump-type }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Pre-release | ${{ steps.release.outputs.is-prerelease }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Initial Development | ${{ steps.release.outputs.is-initial-dev }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ℹ️ No Release Needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No conventional commits found since last release." >> $GITHUB_STEP_SUMMARY
          fi

  # ================================================================
  # Optional: Additional job that runs after release
  # ================================================================
  docs:
    name: Generate & Deploy Documentation
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: ./.github/workflows/_docs.yml
    secrets: inherit
